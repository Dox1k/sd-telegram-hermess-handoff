name: tg-projects
version: 1.1.0
description: "Telegram project switcher. /projects shows an inline keyboard (one button per project + 'Новый проект'; per-project menu: new session / continue last / sessions list / all sessions (desktop included) / model picker / back). /pnew <N|slug> pins a project's primary_path as the cwd for the NEXT session (applied by the on_session_start hook after /new). /pproject <name> <absolute path> [new-folder] creates a project in projects.db plus a new Telegram forum topic, and keeps the thread_id -> project mapping in state.json (never in config.yaml). Desktop sessions (state.db source='desktop') are listed by cwd and can be continued from the phone with a two-process warning."
author: user
kind: standalone
hooks:
  - on_session_start
commands:
  - projects
  - pnew
  - pproject
platform_handlers:
  - telegram
