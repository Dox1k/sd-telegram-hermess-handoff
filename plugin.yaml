name: tg-projects
version: 1.1.0
description: "Telegram project switcher: one forum topic = one project plus one active session in it. /projects (and /menu inside a topic) opens an inline panel with buttons: new session / continue the active session / sessions list (desktop sessions included, with a two-process warning) / model picker / back; exec approvals are confirmed with the core approve/deny buttons. /pnew <N|slug> pins a project's primary_path as the cwd for the NEXT session (applied by the on_session_start hook after /new). /pproject <name> <absolute path> [new-folder] creates a project in projects.db (no topic is created). Topic bindings and panel state live in state.json (never in config.yaml); entries not touched for 7 days are pruned lazily at plugin start and from the /menu handler."
author: user
kind: standalone
hooks:
  - on_session_start
commands:
  - projects
  - pnew
  - pproject
platform_handlers:
  - telegram
